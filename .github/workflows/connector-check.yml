
name: FLOP Agent Connector Checks

on:
  push:
    branches:
      - main
    paths:
      - "agent-connector/**"
      - "package.json"
      - ".github/workflows/connector-check.yml"

  pull_request:
    branches:
      - main
    paths:
      - "agent-connector/**"
      - "package.json"
      - ".github/workflows/connector-check.yml"

  workflow_dispatch:

jobs:
  syntax-check:
    name: JavaScript Syntax and Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Check main connector syntax
        run: node --check agent-connector/index.mjs

      - name: Check formatter module syntax
        run: node --check agent-connector/formatters.mjs

      - name: Check validation module syntax
        run: node --check agent-connector/validation.mjs

      - name: Run all unit tests
        run: node --test agent-connector/test/*.test.mjs
